<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kotzebue Track Finder</title>
<meta name="theme-color" content="#1f4a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, expert field tool; clear at a glance with cold hands
   IDEA: a camera viewfinder and a naturalist's field card
   PICTURE: the viewfinder on home; the field card with its facts on each answer
   COLOUR and TYPE: snow, deep spruce, blaze orange; Barlow Condensed titles, Inter text
   LAYOUT: one column, sticky brand bar, actions docked at the bottom */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f4,#0d1315);--ink:light-dark(#142024,#e8efed);--soft:light-dark(#5b6a6f,#98aaae);
--card:light-dark(#ffffff,#162124);--line:light-dark(#e1e7e5,#25343a);--chip:light-dark(#edf1f0,#1d2b2f);
--deep:light-dark(#1d4a3e,#86c9b2);--spruce:#1d4a3e;--spruce2:#123129;--blaze:#e2561d;--blaze2:#c94612;--blazeink:light-dark(#b8410f,#ff8a57);
--mark:light-dark(#4b666b,#a9c4c8);--warn:light-dark(#fff3ec,#341f15);--ok:#2f9e6e;
--sh:light-dark(0 1px 2px #10181f0f,0 1px 2px #0006),light-dark(0 6px 20px #10181f0d,0 6px 20px #0004)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;line-height:1.04;margin:0;text-wrap:balance;letter-spacing:.005em}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--spruce),var(--spruce2));color:#f2f5f4;padding:12px max(4vw,14px);padding-top:max(12px,env(safe-area-inset-top))}
.hd{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:#ffffff18;display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px;color:#fff}
.brand{flex:1;line-height:1.15}.brand b{display:block;font:700 23px "Barlow Condensed",sans-serif}.brand span{font-size:12.5px;color:#bcd6cd}
#goLog{position:relative;display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:0;background:#ffffff1c;color:#fff;font:600 15px Inter,sans-serif;cursor:pointer}
#goLog svg{width:20px;height:20px}
#cnt:not(:empty){min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--spruce);font-size:12.5px;font-weight:700;display:grid;place-items:center}
#goLog.dotted #cnt{background:var(--blaze);color:#fff}
main{max-width:600px;margin:0 auto;padding:18px max(4vw,14px) 150px}
.screen h2{font-size:clamp(32px,9vw,40px);margin:4px 0 6px}
.sub{color:var(--soft);margin:0 0 18px}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13.5px;font-weight:600;color:var(--soft);margin:2px 0 14px}
.status i{width:8px;height:8px;border-radius:50%;background:#98a6a9}.status.on i{background:var(--ok);box-shadow:0 0 0 4px #2f9e6e26}
.photo{position:relative;display:block;border-radius:22px;overflow:hidden;aspect-ratio:4/3.2;background:radial-gradient(120% 90% at 50% 20%,#2a5f51,#0f2a23);cursor:pointer;box-shadow:var(--sh)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .vf{position:absolute;inset:18px;pointer-events:none;
 background:linear-gradient(#fff,#fff) 0 0/28px 3px,linear-gradient(#fff,#fff) 0 0/3px 28px,linear-gradient(#fff,#fff) 100% 0/28px 3px,linear-gradient(#fff,#fff) 100% 0/3px 28px,
 linear-gradient(#fff,#fff) 0 100%/28px 3px,linear-gradient(#fff,#fff) 0 100%/3px 28px,linear-gradient(#fff,#fff) 100% 100%/28px 3px,linear-gradient(#fff,#fff) 100% 100%/3px 28px;background-repeat:no-repeat;opacity:.85}
.photo .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#e8f2ee;font-weight:600;text-align:center;padding:0 30px}
.photo .shutter{width:78px;height:78px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px #ffffff33}
.photo .shutter svg{width:34px;height:34px;color:var(--spruce)}
.photo .in small{font-weight:400;color:#b9d3ca;font-size:13.5px}
.photo .retake{position:absolute;right:14px;top:14px;background:#0f2a23cc;color:#fff;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;backdrop-filter:blur(6px)}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo:focus-within{outline:3px solid var(--blaze);outline-offset:3px}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots i{flex:1;height:5px;border-radius:5px;background:var(--line)}.dots i.on{background:var(--blaze)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:148px;padding:16px 10px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 16.5px Inter,sans-serif;text-align:center;cursor:pointer;box-shadow:var(--sh);transition:transform .12s,border-color .12s}
.pick svg{width:68px;height:68px;color:var(--mark)}
.pick:active{transform:scale(.97)}
.pick.sel{border-color:var(--deep);box-shadow:0 0 0 3px light-dark(#1d4a3e22,#86c9b233)}
.pick small{font-weight:400;font-size:13px;color:var(--soft)}
.bar{display:flex;gap:10px;margin-top:16px}
.bar.wrap{flex-wrap:wrap}.bar.wrap .btn{flex:1 1 220px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px max(4vw,14px) max(12px,env(safe-area-inset-bottom));background:light-dark(#f3f5f4e6,#0d1315e6);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.dock .bar{max-width:600px;margin:0 auto}
.btn{flex:1;min-height:54px;padding:12px 18px;border-radius:15px;border:0;background:var(--blaze);color:#fff;font:600 16.5px Inter,sans-serif;cursor:pointer;box-shadow:0 2px 0 var(--blaze2)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.6}
button:focus-visible,input:focus-visible{outline:3px solid var(--blaze);outline-offset:2px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);border:1px solid var(--line)}
.hero{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;margin-bottom:-36px}
.big{padding:20px;position:relative}
.big .lbl{color:var(--soft);font-weight:600;font-size:13px;letter-spacing:.02em}
.big h3{font-size:clamp(38px,11vw,50px);margin:4px 0 2px}
.big em{font-style:italic;color:var(--soft)}
.meter{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-weight:600;font-size:14.5px}
.meter span{display:flex;gap:4px}.meter span i{width:26px;height:8px;border-radius:4px;background:var(--line)}.meter span i.on{background:var(--deep)}
.big p{margin:10px 0 0;color:var(--ink)}
.facts{margin-top:14px;padding:4px 18px}
.fact{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .ic{width:36px;height:36px;border-radius:11px;background:var(--chip);display:grid;place-items:center;color:var(--deep)}
.fact .ic svg{width:20px;height:20px}
.fact b{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:.02em}.fact p{margin:1px 0 0}
.also{display:grid;gap:10px;margin-top:14px}
.small{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font:inherit;cursor:pointer;box-shadow:var(--sh)}
.small div{flex:1}.small h3{font-size:24px}.small p{margin:2px 0 0;font-size:14px;color:var(--soft)}
.small>span{font-size:26px;color:var(--soft)}
.section{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:.02em;margin:22px 0 0}
.warn{display:flex;gap:10px;background:var(--warn);border:1px solid light-dark(#f6c9b3,#5b3322);padding:12px 14px;border-radius:16px;margin:0 0 14px}
.warn b{color:var(--blazeink)}.warn>svg{width:22px;height:22px;flex:none;margin-top:2px;color:var(--blazeink)}
input[type=text]{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;margin-top:14px}
.msg{min-height:22px;color:var(--deep);font-weight:600;margin-top:10px;font-size:15px}
.wait{text-align:center}.wait .photo{margin-bottom:22px}
.spin{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blaze)}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.log{display:grid;gap:10px;margin-top:6px}
.entry{display:grid;grid-template-columns:60px minmax(0,1fr) 44px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--sh)}
.entry img,.entry .ph{width:60px;height:60px;border-radius:12px;object-fit:cover;background:var(--chip)}
.entry .open{display:block;text-align:left;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.entry h3{font-size:22px}.entry p{margin:2px 0 0;font-size:13.5px;color:var(--soft)}
.entry .del{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--soft);cursor:pointer}
.entry .del svg{width:20px;height:20px}
.entry .idnow{grid-column:2/4;min-height:44px;border:0;border-radius:12px;background:var(--blaze);color:#fff;font:600 15px Inter,sans-serif;cursor:pointer}
.entry .idnow:disabled{background:var(--chip);color:var(--soft)}
.pend{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;background:var(--warn);color:var(--blazeink);font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:40px 10px;color:var(--soft)}.empty svg{width:56px;height:56px;color:var(--mark);margin-bottom:8px}
textarea{width:100%;min-height:140px;font:14px Inter,sans-serif;margin-top:10px;border-radius:14px;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.note{font-size:13.5px;color:var(--soft);margin-top:16px;text-align:center}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.tool{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--sh);min-height:72px}
.tool .ic{width:40px;height:40px;flex:none;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--deep)}.tool .ic svg{width:22px;height:22px}
.tool b{display:block;font-size:15.5px}.tool small{display:block;color:var(--soft);font-size:12.5px;line-height:1.3}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--chip);margin:12px 0 14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--soft);font:600 14.5px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.gi{width:46px;height:46px;flex:none;border-radius:13px;background:var(--chip);display:grid;place-items:center}.gi svg{width:30px;height:30px;color:var(--mark)}
.rul{padding:0 0 0 0;overflow:hidden;border-radius:0 16px 16px 0;border-left:0}
.calbox{margin:10px 0 18px;border:3px solid var(--ok);border-radius:12px;background:#2f9e6e1a;display:grid;place-items:center;color:var(--ok);font-weight:700}
input[type=range]{width:100%;height:44px;accent-color:var(--blaze)}
.tracks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 28px;padding:16px;margin-top:14px}
.tracks figure,.qpic figure{margin:0;text-align:center}.tracks svg{width:92px;height:110px;color:var(--deep)}
.tracks figcaption,.qpic figcaption{font-size:13px;font-weight:600;color:var(--soft);margin-top:4px}
.tracks p{flex-basis:100%;margin:6px 0 0;font-size:12.5px;color:var(--soft);text-align:center}
.gi svg{width:34px;height:40px;color:var(--deep)}
.pat{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;padding:14px 16px}
.pd svg{width:74px;height:172px;color:var(--deep)}
.pat h3{font-size:24px}.pat .how{margin:2px 0 6px;font-weight:600;color:var(--blazeink);font-size:14px}.pat p{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{min-height:36px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 13.5px Inter,sans-serif;cursor:pointer}
.qpic{display:flex;justify-content:center;gap:30px;padding:18px;margin-top:6px}.qpic svg{width:110px;height:132px;color:var(--deep)}.qpic.pq svg{width:90px;height:210px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{min-height:54px;padding:12px 16px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Inter,sans-serif;text-align:left;cursor:pointer;box-shadow:var(--sh)}
.opt.right{border-color:var(--ok);background:light-dark(#e7f6ee,#16301f)}.opt.wrong{border-color:var(--blaze);background:var(--warn)}
.opt:disabled{cursor:default;color:var(--ink)}
.fbk{margin-top:14px;padding:14px 16px;border-left:5px solid var(--blaze)}.fbk.ok{border-left-color:var(--ok)}.fbk p{margin:4px 0 0}
.mapbox{height:62vh;min-height:320px;overflow:hidden;padding:0}
.popb{margin-top:6px;min-height:34px;padding:4px 12px;border:0;border-radius:8px;background:#1d4a3e;color:#fff;font:600 13px Inter,sans-serif;cursor:pointer}
.leaflet-popup-content{font:14px/1.4 Inter,sans-serif}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.gal button{padding:0;border:0;background:none;cursor:pointer;text-align:left;color:var(--soft);font:12px Inter,sans-serif}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;margin-bottom:3px}
.chips.big button{min-height:44px;padding:8px 14px;font-size:15px}.chips button.on{background:var(--deep);color:light-dark(#fff,#0f1a17);border-color:var(--deep)}
.agecard ul{margin:10px 0 0;padding-left:20px}.agecard li{margin:4px 0}
.btn.mini{flex:none;min-height:44px;padding:8px 14px;font-size:15px;margin-top:8px;display:inline-flex;align-items:center}
.filebtn{position:relative;cursor:pointer}.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.linkb{background:none;border:0;color:var(--deep);font:600 15px Inter,sans-serif;text-decoration:underline;cursor:pointer;min-height:44px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .22s ease}@keyframes in{from{opacity:0}}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="mark" aria-hidden="true"><svg viewBox="-12 -14 24 26" fill="currentColor"><ellipse cx="0" cy="6" rx="7" ry="6"/><circle cx="-7" cy="-4" r="3"/><circle cx="-2.5" cy="-9" r="3"/><circle cx="2.5" cy="-9" r="3"/><circle cx="7" cy="-4" r="3"/></svg></div>
  <div class="brand"><b>Track Finder</b><span>Kotzebue · Northwest Arctic</span></div>
  <button type="button" id="goLog" aria-label="My log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6M9 11h6"/></svg>Log <span id="cnt"></span></button>
</div></header>
<main id="app"></main>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const Y=[2,2,2,2,2,2,2,2,2,2,2,2],SUM=[0,0,0,0,2,2,2,2,2,1,0,0];

// little pictures (currentColor)
const P=(d,vb='0 0 80 80')=>`<svg viewBox="${vb}" fill="currentColor" aria-hidden="true">${d}</svg>`;
const paw=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="6" rx="7" ry="6"/><circle cx="-7" cy="-4" r="3"/><circle cx="-2.5" cy="-9" r="3"/><circle cx="2.5" cy="-9" r="3"/><circle cx="7" cy="-4" r="3"/></g>`;
const dot=(x,y,r=5)=>`<circle cx="${x}" cy="${y}" r="${r}"/>`;
const IC={
 paw:P(paw(40,42,2.4)),
 hoof:P('<path d="M38 14C26 16 22 34 24 50c1 10 8 16 14 14V14zM42 14c12 2 16 20 14 36-1 10-8 16-14 14V14z"/>'),
 bird:P('<g stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none"><path d="M40 66V40M40 40L20 16M40 40V10M40 40L60 16M40 66v6"/></g>'),
 t4:P(paw(40,42,2.4)),
 t5:P('<g transform="translate(40 44) scale(2.3)"><ellipse cx="0" cy="6" rx="7.5" ry="6"/><circle cx="-9" cy="-1" r="2.6"/><circle cx="-5" cy="-7" r="2.6"/><circle cx="0" cy="-9" r="2.6"/><circle cx="5" cy="-7" r="2.6"/><circle cx="9" cy="-1" r="2.6"/></g>'),
 thin:P('<g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"><path d="M40 50L18 18M40 50V10M40 50L62 18M40 50V72"/></g>'),
 feather:P('<g stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none" opacity=".85"><path d="M40 52L22 22M40 52V16M40 52L58 22"/></g>'),
 web:P('<path d="M40 64L14 22Q27 30 40 14Q53 30 66 22Z"/><path d="M40 64v10" stroke="currentColor" stroke-width="5"/>'),
 zygo:P('<g stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none"><path d="M40 40L24 12M40 40L56 12M40 40L22 68M40 40L58 68"/></g>'),
 line:P([10,24,38,52,66].map((y,i)=>dot(i%2?46:34,y+2)).join('')),
 wander:P([[16,14],[34,22],[24,38],[48,40],[38,58],[62,62]].map(([x,y])=>dot(x,y)).join('')),
 pairs:P([14,40,66].map(y=>dot(32,y)+dot(48,y)).join('')),
 four:P([12,48].map(y=>dot(30,y+16,4)+dot(50,y+16,4)+dot(36,y+4,6)+dot(46,y+4,6)).join('')),
 waddle:P([14,40,66].map((y,i)=>`<ellipse cx="${i%2?52:28}" cy="${y}" rx="9" ry="7"/>`).join('')+'<path d="M18 4v74M62 4v74" stroke="currentColor" stroke-width="2" opacity=".4"/>'),
 slide:P('<rect x="30" y="8" width="20" height="50" rx="10" opacity=".55"/>'+dot(32,68,4)+dot(48,68,4)),
 herd:P([[20,14],[40,22],[60,12],[28,40],[52,44],[18,64],[44,66],[64,60]].map(([x,y])=>`<path d="M${x-1} ${y-7}c-5 1-6 8-5 13 1 3 3 4 5 3zM${x+1} ${y-7}c5 1 6 8 5 13-1 3-3 4-5 3z"/>`).join('')),
 walk:P([12,32,52].map((y,i)=>`<g transform="translate(${i%2?48:32} ${y+10})" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M0 6L-7-6M0 6V-8M0 6L7-6"/></g>`).join('')),
 hop:P([18,50].map(y=>[30,50].map(x=>`<g transform="translate(${x} ${y+8})" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M0 6L-7-6M0 6V-8M0 6L7-6"/></g>`).join('')).join('')),

// ---------- photo ----------
function shrink(img,max){const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
function onPhoto(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  clearPhoto();photoURL=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{try{shrink(img,1024).toBlob(b=>{photoBlob=b||f;home()},'image/jpeg',.82);thumb=shrink(img,160).toDataURL('image/jpeg',.6)}catch(err){photoBlob=f;home()}};
  img.onerror=()=>{photoBlob=f;home()};
  img.src=photoURL;warm();getFix();
}
const toB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(b)});

// photos saved for later live in IndexedDB on the phone
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('ktf',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function photoStore(mode,id,blob){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction('photos',mode==='get'?'readonly':'readwrite');const s=t.objectStore('photos');
  const q=mode==='get'?s.get(id):mode==='put'?s.put(blob,id):s.delete(id);t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})}
async function saveForLater(){
  if(!photoBlob)return;const id='p'+Date.now();
  try{await photoStore('put',id,photoBlob)}catch(e){$('#msg').textContent='Couldn\'t save the photo on this phone.';return}
  addEntry({id,sp:'Not identified yet',c:'',pending:1,photo:1});
  $('#msg').textContent='Saved. Open My log when you have signal and tap Identify now.';
}

// ---------- photo identification ----------
async function photoId(blob,answers,fromLog){
  if(!blob)return home();
  if(!online())return failed('You have no signal right now.',blob,fromLog);
  if(!getCode())return askCode(()=>photoId(blob,answers,fromLog));
  view='wait';const url=URL.createObjectURL(blob);
  show(`<div class="wait"><div class="photo" style="cursor:default"><img src="${url}" alt=""></div>
    <div class="spin"></div><h2>Studying your track…</h2><p class="sub" id="slow">This usually takes a few seconds.</p></div>`);
  const slow=setTimeout(()=>{const s=$('#slow');if(s)s.textContent='Waking up the server. The first check of the day can take up to a minute.'},8000);
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),90000);
  try{
    const r=await fetch(API+'/api/identify',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
      body:JSON.stringify({code:getCode(),image:await toB64(blob),answers,month:new Date().getMonth()})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){setCode('');return askCode(()=>photoId(blob,answers,fromLog),true)}
    if(r.status===503)return failed('Photo checking isn\'t switched on yet.',blob,fromLog);
    if(r.status===429)return failed('Too many photos this hour. Try again later.',blob,fromLog);
    if(!r.ok||!j.name)return failed('Something went wrong checking the photo.',blob,fromLog);
    const m=SP.find(x=>j.name&&(j.name.toLowerCase().includes(x.n.toLowerCase().split(' (')[0])||x.n.toLowerCase().includes(j.name.toLowerCase())));
    detail(j,{photo:true,fromLog,top:m?trackPanel(m.n):''});
  }catch(e){failed(e.name==='AbortError'?'It took too long. The signal may be weak.':'Couldn\'t connect. The signal may be weak.',blob,fromLog)}

// ---------- tap questions (work offline) ----------
function ask(){
  view='ask';flow=pathFor();const key=flow[step];const S=STEPS[key];
  const opts=S.byKind?S.byKind[a.kind]:S.opts;
  show(`<div class="dots">${flow.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
    <h2>${S.q}</h2><p class="sub">${S.sub||'&nbsp;'}</p>
    <div class="grid">${opts.map(([v,l,ic])=>`<button type="button" class="pick ${a[key]===v?'sel':''}" data-v="${v}">${ic}<span>${l}</span></button>`).join('')}
      ${key!=='kind'?`<button type="button" class="pick" data-v="">${IC.unsure}<span>Not sure</span><small>Skip</small></button>`:''}</div>
    <div class="bar"><button class="btn alt" type="button" id="back">Back</button></div>`);
  app.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>{
    a[key]=b.dataset.v||null;
    if(key==='kind'){delete a.toes;delete a.foot;delete a.pat}
    flow=pathFor();step++;step<flow.length?ask():results();
  }));
  $('#back').addEventListener('click',()=>{step?(step--,ask()):home()});
}
function score(sp,m){
  if(a.kind&&sp.k!==a.kind)return null;
  let s=0;
  if(a.toes){s+=sp.toes.includes(+a.toes)?3:-4}
  if(a.foot){s+=sp.foot===a.foot?4:-5}
  if(a.size){const [lo,hi]=SIZES.find(x=>x[0]===a.size)[1];
    if(sp.sz[0]<=hi&&sp.sz[1]>=lo)s+=4;else{const d=sp.sz[1]<lo?(lo-sp.sz[1])/lo:(sp.sz[0]-hi)/hi;s+=d<0.3?0:-5}}
  if(a.pat){s+=PATMAP[a.pat].some(p=>sp.pat.includes(p))?3:-2}
  if(a.hab){s+=HABMAP[a.hab].some(h=>sp.hab.includes(h))?1.5:-0.5}
  const v=sp.mo[m];s+=v===2?1:v===0?-4:0;
  return {sp,s};
}
const answerText=()=>Object.entries(a).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join(', ');
function infoFor(r,c,others){
  return {name:r.sp.n,inupiaq:r.sp.inu,sure:c,about:ABOUT[r.sp.n]||'',why:r.sp.tip,
    safety:r.sp.safe?'If the tracks look fresh, don\'t follow them. Go back the way you came and keep kids and dogs close.':'',
    also:others};
}
function results(){
  const m=new Date().getMonth();
  const all=SP.map(sp=>score(sp,m)).filter(Boolean).sort((x,y)=>y.s-x.s);
  res=all.slice(0,3);const t=res[0].s,t2=res[1]?res[1].s:-9;
  const c=t>=9&&t-t2>=3?'Pretty sure':t>=5?'Good guess':'Rough guess';
  const others=res.slice(1).map(r=>r.sp.n).join(' or ');
  const canPhoto=photoBlob&&online();
  const extra=(canPhoto?'<button class="btn alt" type="button" id="chk">Check my photo too</button>':'')+'<button class="btn alt" type="button" id="chg">Change my answers</button>';
  detail(infoFor(res[0],c,''),{top:trackPanel(res[0].sp.n),extra,onExtra:()=>{
    const ck=$('#chk');if(ck)ck.addEventListener('click',()=>photoId(photoBlob,answerText()));
    $('#chg').addEventListener('click',()=>{step=flow.length-1;ask()});
    if(res.length>1){const box=$('#more');box.className='also';
      box.innerHTML='<p class="section">Other possibilities</p>'+res.slice(1).map((r,i)=>`<button type="button" class="small" data-o="${i+1}"><div><h3>${esc(r.sp.n)}</h3><p>${esc(r.sp.tip)}</p></div><span aria-hidden="true">›</span></button>`).join('');
      box.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>{const r=res[+b.dataset.o];detail(infoFor(r,'Possible',res[0].sp.n),{top:trackPanel(r.sp.n),extra:'<button class="btn alt" type="button" id="bk">Back to best match</button>',onExtra:()=>$('#bk').addEventListener('click',results)})}));
    }
  }});
}

// ---------- field guide (offline) ----------
const HABN={town:'town',coast:'beaches',ice:'sea ice',tundra:'open tundra',willow:'willows and rivers',hills:'hills',water:'ponds and creeks'};
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function season(mo){
  if(mo.every(v=>v===2))return 'All year';
  const on=mo.map(v=>v===2);let st=on.findIndex((v,i)=>v&&!on[(i+11)%12]);if(st<0)st=0;
  let en=st;while(on[(en+1)%12]&&(en+1)%12!==st)en=(en+1)%12;
  return `Most often ${MS[st]}–${MS[en]}`+(mo.some(v=>v===0)?', rarely seen other months':'');
}
const inch=x=>x<1?`${x}`:`${x}`;
function spInfo(sp){
  const now=sp.mo[new Date().getMonth()];
  return {name:sp.n,inupiaq:sp.inu,about:ABOUT[sp.n]||'',why:sp.tip,
    size:`${sp.sz[0]}–${sp.sz[1]} in (${Math.round(sp.sz[0]*2.54)}–${Math.round(sp.sz[1]*2.54)} cm)`,
    local:`Look in ${sp.hab.map(h=>HABN[h]).join(', ')}. ${season(sp.mo)}.`+(now===0?' Not likely right now.':now===2?' Likely right now.':''),
    safety:sp.safe?'Give this animal plenty of room. Don\'t follow fresh tracks.':''};
}

      <div><h3>${esc(sp.n)}</h3><p>${sp.inu?esc(sp.inu)+' · ':''}${sp.sz[0]}–${sp.sz[1]} in</p></div><span aria-hidden="true">›</span></button>`).join('')||'<p class="empty">No match.</p>'}</div>
    <div class="dock"><div class="bar"><button class="btn alt" type="button" id="home">Back</button></div></div>`);

  case 'hoof':{const k=p.k,f=hind?.92:1;
    const half={caribou:`M47 18 C30 20 18 48 21 76 C23 92 34 99 45 95 C42 70 44 40 47 18Z`,
      moose:`M48 8 C39 22 31 52 33 80 C34 95 41 101 48 97 C47 70 47 40 48 8Z`,
      muskox:`M48 26 C29 26 21 50 23 76 C25 93 36 99 47 96 C46 72 47 48 48 26Z`}[k];
    const g=`<g transform="translate(50 0) scale(${f} 1) translate(-50 0)">${mirror(`<path d="${half}"/>`)}</g>`;
    s+=k==='caribou'?`<g transform="translate(0 0)">${g}</g>`+mirror(El(31,110,5,7))+'' :g;
    if(k==='moose')s+=mirror(El(36,112,4,6,0,.35));break}
  case 'bird':{const w=p.w,b=p.back,t=p.toe,cx=50,cy=72;
    const ln=(x,y)=>`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`;
    s+=ln(cx-t*.78,cy-t*1.08)+ln(cx,cy-t*1.3)+ln(cx+t*.78,cy-t*1.08)+(b?ln(cx,cy+b):'')+El(cx,cy,w*.9,w*.9);
    s=blur(s,p.fur);break}
  case 'web':{const W=p.wide?1.12:p.narrow?.92:1,X=x=>50+(x-50)*W;
    s+=`<path d="M50 84 L${X(18)} 28 Q${X(34)} 40 50 20 Q${X(66)} 40 ${X(82)} 28 Z" opacity=".42"/>`
      +[[X(18),28],[50,16],[X(82),28]].map(([x,y])=>`<line x1="50" y1="82" x2="${x}" y2="${y}" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>`).join('')+El(50,84,5,5);break}
  case 'zygo':{const ln=(x,y)=>`<line x1="50" y1="62" x2="${x}" y2="${y}" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>`;
    s+=blur(ln(36,20)+ln(62,18)+ln(28,98)+ln(70,96)+El(50,62,9,9),1.2)
      +[[36,20],[62,18],[28,98],[70,96]].map(([x,y])=>El(x+(x<50?-2:2)*(y<50?1:1),y+(y<50?-7:7),1.8,4,0)).join('');break}
  }
  return `<svg viewBox="0 0 100 120" fill="currentColor" aria-hidden="true"><defs>${fdefs}</defs>${s}</svg>`;
}
const isBird=n=>['bird','web','zygo'].includes((TR[n]||{}).t);
function trackPanel(name){
  if(!TR[name])return '';
  const pics=isBird(name)?[['Foot',trackArt(name,false)]]:[['Front',trackArt(name,false)],['Hind',trackArt(name,true)]];
  return `<div class="card tracks">${pics.map(([l,svg])=>`<figure>${svg}<figcaption>${l}</figcaption></figure>`).join('')}

// ---------- trail patterns + measuring (offline) ----------
const PATTERNS=[
 {id:'walk',name:'Straight line',how:'Walking or trotting',what:'Each hind foot lands in or near its front print, so the trail is one neat line. An animal traveling steadily and saving energy.',who:['Red fox','Arctic fox','Wolf','Lynx','Caribou','Moose']},
 {id:'wander',name:'Wandering',how:'Ambling with no plan',what:'Prints go every which way, with side trips and sniffing spots. Usually a dog near people\'s trails.',who:['Dog']},
 {id:'bound',name:'Pairs side by side',how:'Bounding',what:'Front feet land, then the hind feet land in the same spots, leaving pairs. Gaps change as it speeds up or dives into the snow.',who:['Ermine (weasel)','Mink','River otter']},
 {id:'hop',name:'Groups of 4',how:'Hopping',what:'Small front feet land first, then the big hind feet swing past and land ahead. The two big prints point the way it was going.',who:['Snowshoe hare','Alaska hare','Vole or lemming']},
 {id:'lope',name:'Slanted groups of 3–4',how:'Loping',what:'Four prints in a slanted group, repeating. A relaxed run that covers long distances.',who:['Wolverine','River otter','Red fox']},
 {id:'waddle',name:'Wide, waddling',how:'Waddling or pacing',what:'A wide trail with toes often turned in. Heavy or slow animals that rock from side to side.',who:['Brown bear','Porcupine','Beaver','Muskrat']},
 {id:'bwalk',name:'Bird prints in a line',how:'Bird walking',what:'Prints one in front of the other. Ground birds that walk while they feed.',who:['Willow ptarmigan','Rock ptarmigan','Raven','Snow bunting','Gull']},
 {id:'bhop',name:'Bird prints in pairs',how:'Bird hopping',what:'Prints side by side. Small perching birds that hop.',who:['Redpoll','Raven']}
];
function patSVG(id){
  const o=(x,y,rx=5,ry=7,r=0)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"${r?` transform="rotate(${r} ${x} ${y})"`:''}/>`;
  const bf=(x,y)=>`<g transform="translate(${x} ${y})" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M0 5L-6-5M0 5V-8M0 5L6-5M0 5v4"/></g>`;
  let s='';
  if(id==='walk')for(let i=0;i<6;i++)s+=o(i%2?52:40,180-i*30);
  if(id==='wander')[[30,184],[48,168],[36,148],[58,140],[44,118],[66,104],[50,86],[30,74],[42,52],[62,40],[48,22]].forEach(([x,y],i)=>s+=o(x,y,5,7,i*25-40));
  if(id==='bound')for(let y of[176,118,60])s+=o(38,y,4,5)+o(52,y-4,4,5);
  if(id==='hop')for(let y of[168,90]){s+=o(44,y+26,3.5,4.5)+o(46,y+12,3.5,4.5)+o(32,y-12,5,10)+o(58,y-12,5,10)}
  if(id==='lope')for(let y of[168,92]){s+=o(34,y+24,4.5,6)+o(42,y+10,4.5,6)+o(50,y-2,4.5,6)+o(58,y-16,4.5,6)}
  if(id==='waddle')for(let i=0;i<5;i++)s+=o(i%2?64:26,180-i*36,7,9,i%2?-18:18);
  if(id==='bwalk')for(let i=0;i<6;i++)s+=bf(i%2?52:40,180-i*30);
  if(id==='bhop')for(let y of[176,120,64])s+=bf(38,y)+bf(54,y-2);
  return `<svg viewBox="0 0 90 210" fill="currentColor" aria-hidden="true"><path d="M78 196V14M72 22l6-10 6 10" stroke="currentColor" stroke-width="2" fill="none" opacity=".35"/>${s}</svg>`;
}
function patterns(){
  view='patterns';
  show(`<h2>Trail patterns</h2><p class="sub">Step back and look at how the prints are grouped. The pattern tells you the animal family before you look closely. Arrows show the direction of travel.</p>
    <div class="log">${PATTERNS.map(p=>`<div class="card pat"><div class="pd">${patSVG(p.id)}</div><div><h3>${p.name}</h3><p class="how">${p.how}</p><p>${p.what}</p>
      <div class="chips">${p.who.map(n=>`<button type="button" data-sp="${esc(n)}">${esc(n)}</button>`).join('')}</div></div></div>`).join('')}</div>

      <div class="fact"><span class="ic">${FI.size}</span><div><b>Length and width</b><p>Measure one clear print from the back of the heel pad to the tip of the front toe. Leave out the claw marks. Measure the widest point for width.</p></div></div>

// ---------- quiz (offline) ----------
let Q=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function newQuiz(){
  const sp=shuffle(SP.filter(s=>TR[s.n])).slice(0,7);
  const qs=sp.map(s=>{const others=shuffle(SP.filter(x=>x.n!==s.n&&TR[x.n]));
    const near=others.filter(x=>x.k===s.k).slice(0,2),far=others.filter(x=>x.k!==s.k&&!near.includes(x)).slice(0,3-near.length);
    return {kind:'track',sp:s,ans:s.n,opts:shuffle([s.n,...near.map(x=>x.n),...far.map(x=>x.n)])}});
  shuffle(PATTERNS).slice(0,3).forEach(p=>{const others=shuffle(PATTERNS.filter(x=>x.id!==p.id)).slice(0,3);
    qs.push({kind:'pattern',p,ans:p.how,opts:shuffle([p.how,...others.map(x=>x.how)])})});
  Q={qs:shuffle(qs),i:0,score:0};
}
function quiz(start){
  view='quiz';if(start||!Q)newQuiz();
  if(Q.i>=Q.qs.length){const n=Q.qs.length,s=Q.score;
    show(`<div class="empty" style="padding:20px 0 0">${IC.paw}</div><h2 style="text-align:center">${s} out of ${n}</h2>
      <p class="sub" style="text-align:center">${s>=9?'Expert tracker. The trail has no secrets from you.':s>=6?'Nice work. A few more rounds and you\'ll be reading trails at a glance.':'Good start. Browse the field guide and trail patterns, then try again.'}</p>
      <div class="tools"><button type="button" class="tool" id="g1"><span class="ic">${FI.book}</span><span><b>Field guide</b><small>Study the tracks</small></span></button>
      <button type="button" class="tool" id="p1"><span class="ic">${FI.doing}</span><span><b>Trail patterns</b><small>Gaits and measuring</small></span></button></div>
      <div class="dock"><div class="bar"><button class="btn alt" type="button" id="home">Done</button><button class="btn" type="button" id="again">Play again</button></div></div>`);
    $('#g1').addEventListener('click',()=>guide());$('#p1').addEventListener('click',patterns);
    $('#again').addEventListener('click',()=>quiz(true));$('#home').addEventListener('click',home);return}
  const q=Q.qs[Q.i];
  const pic=q.kind==='track'?`<div class="card qpic">${isBird(q.sp.n)?`<figure>${trackArt(q.sp.n,false)}<figcaption>Foot</figcaption></figure>`:`<figure>${trackArt(q.sp.n,false)}<figcaption>Front</figcaption></figure><figure>${trackArt(q.sp.n,true)}<figcaption>Hind</figcaption></figure>`}</div>
      <p class="sub" style="margin:10px 0 0">Print about ${q.sp.sz[0]}–${q.sp.sz[1]} in (${Math.round(q.sp.sz[0]*2.54)}–${Math.round(q.sp.sz[1]*2.54)} cm)</p>`
    :`<div class="card qpic pq">${patSVG(q.p.id)}</div>`;
  show(`<div class="dots">${Q.qs.map((_,i)=>`<i class="${i<=Q.i?'on':''}"></i>`).join('')}</div>
    <h2>${q.kind==='track'?'Whose tracks are these?':'What is this animal doing?'}</h2>${pic}
    <div class="opts">${q.opts.map(o=>`<button type="button" class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div id="fb" aria-live="polite"></div>
    <div class="dock"><div class="bar"><button class="btn alt" type="button" id="quit">Quit</button><button class="btn" type="button" id="nx" disabled>Next</button></div></div>`);
  app.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(app.querySelector('.opt.right'))return;
    const ok=b.dataset.o===q.ans;if(ok)Q.score++;
    app.querySelectorAll('.opt').forEach(x=>{if(x.dataset.o===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong');x.disabled=true});
    $('#fb').innerHTML=`<div class="card fbk ${ok?'ok':''}"><b>${ok?'Correct!':'Not quite. It\'s '+esc(q.ans)+'.'}</b><p>${esc(q.kind==='track'?q.sp.tip:q.p.what)}</p></div>`;
    $('#fb').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});const nx=$('#nx');nx.disabled=false;nx.textContent=Q.i===Q.qs.length-1?'See my score':'Next';nx.focus();
  }));
  $('#nx').addEventListener('click',()=>{Q.i++;quiz()});$('#quit').addEventListener('click',()=>{Q=null;home()});
}

// ---------- log ----------
const KEY='ktf-log';
const getLog=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}};
const setLog=l=>{try{localStorage.setItem(KEY,JSON.stringify(l));return true}catch(e){return false}};
const fmt=d=>{const x=new Date(d);return x.toLocaleDateString(undefined,{month:'short',day:'numeric'})+', '+x.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};
const pref=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const setPref=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const spMatch=n=>{n=String(n||'').toLowerCase();return n?SP.find(x=>{const b=x.n.toLowerCase().split(' (')[0];return n.includes(b)||b.includes(n)}):null};
function count(){const l=getLog(),p=l.filter(e=>e.pending).length;$('#cnt').textContent=l.length?String(l.length):'';$('#goLog').classList.toggle('dotted',p>0)}

// GPS: where each find was made (asked once by the phone; can be switched off)
let lastFix=null;
const gpsOn=()=>pref('ktf-gps','1')==='1';
function getFix(){return new Promise(ok=>{
  if(!gpsOn()||!navigator.geolocation)return ok(null);
  if(lastFix&&Date.now()-lastFix.t<5*60e3)return ok(lastFix);
  navigator.geolocation.getCurrentPosition(p=>{lastFix={lat:+p.coords.latitude.toFixed(5),lon:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy),t:Date.now()};ok(lastFix)},
    ()=>ok(null),{enableHighAccuracy:true,timeout:15000,maximumAge:120000})})}
function addEntry(e,blob){
  const l=getLog();const loc=(($('#loc')||{}).value||'').trim();const id=e.id||'e'+Date.now();
  l.unshift({id,d:new Date().toISOString(),loc,thumb:thumb&&thumb!=='x'?thumb:'',...e,id});
  if(!setLog(l.slice(0,500))){l[0].thumb='';setLog(l.slice(0,500))}
  if(blob)photoStore('put',id,blob).then(()=>patch(id,{photo:1})).catch(()=>{});
  getFix().then(f=>{if(f)patch(id,{lat:f.lat,lon:f.lon,acc:f.acc})});
  count();return id;
}
function patch(id,obj){const l=getLog();const e=l.find(x=>x.id===id);if(e){Object.assign(e,obj);setLog(l)}}
function finishPending(id,info){
  const l=getLog();const e=l.find(x=>x.id===id);if(!e)return;
  Object.assign(e,{sp:info.name,c:info.sure||'',info,pending:0,photo:1});setLog(l);count();
}
const mapsLink=e=>`https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lon}`;
async function openEntry(e,back){
  let img=e.thumb;if(e.photo||e.pending){try{const b=await photoStore('get',e.id);if(b)img=URL.createObjectURL(b)}catch(x){}}
  const info=e.info||{name:e.sp,sure:e.c,about:ABOUT[e.sp]||''};const m=spMatch(e.sp);
  const where=e.lat!=null?`<a class="btn alt" href="${mapsLink(e)}" target="_blank" rel="noopener">Open in Maps</a>`:'';
  detail({...info,where:[e.loc,e.lat!=null?`GPS ${e.lat}, ${e.lon} (within about ${e.acc||'?'} m)`:''].filter(Boolean).join(' · ')},
    {saved:e.d,img,top:m?trackPanel(m.n):'',extra:where,back:back||showLog});
}
function showLog(){
  view='log';const l=getLog();const on=online();const geo=l.filter(e=>e.lat!=null).length;
  show(`<h2>My log</h2><p class="sub">${l.length?`${l.length} track${l.length>1?'s':''} saved on this phone. Tap one for details.`:'Tracks you save show up here.'}</p>
    ${l.length?`<div class="tools"><button type="button" class="tool" id="mapb"><span class="ic">${FI.local}</span><span><b>Map of finds</b><small>${geo} with a location</small></span></button>
      <button type="button" class="tool" id="bk"><span class="ic">${FI.save}</span><span><b>Backup & export</b><small>Spreadsheet, backup, restore</small></span></button></div>`:''}
    <div class="log" style="margin-top:14px">${l.length?l.map((e,i)=>`<div class="entry">${e.thumb?`<img src="${esc(e.thumb)}" alt="">`:'<div class="ph"></div>'}
      <button type="button" class="open" data-open="${i}"><h3>${esc(e.sp)}</h3><p>${esc(fmt(e.d))}${e.loc?' · '+esc(e.loc):''}${e.lat!=null?' · GPS saved':''}</p>
        ${e.pending?'<span class="pend">Waiting to identify</span>':e.c?`<p>${esc(e.c)}</p>`:''}</button>
      <button type="button" class="del" data-del="${i}" aria-label="Delete">${FI.trash}</button>
      ${e.pending?`<button type="button" class="idnow" data-id="${esc(e.id)}" ${on?'':'disabled'}>${on?'Identify now':'Needs signal to identify'}</button>`:''}</div>`).join('')
      :`<div class="empty">${IC.paw}<p>No tracks yet. Find one and tap Save.</p><p><button type="button" class="linkb" id="bk0">Restore from a backup</button></p></div>`}</div>
    <div class="dock"><div class="bar"><button class="btn" type="button" id="home">Find a track</button></div></div>`);
  app.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{const x=getLog();const [gone]=x.splice(+b.dataset.del,1);if(gone)photoStore('del',gone.id).catch(()=>{});setLog(x);count();showLog()}));
  app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const e=l[+b.dataset.open];if(!e.pending)openEntry(e)}));

    let blob;try{blob=await photoStore('get',b.dataset.id)}catch(e){}
    if(!blob){b.textContent='Photo missing';return}

  $('#home').addEventListener('click',()=>{clearPhoto();home()});
  const mb=$('#mapb');if(mb)mb.addEventListener('click',showMap);
  const bk=$('#bk')||$('#bk0');if(bk)bk.addEventListener('click',backupScreen);
}

// ---------- map of finds (map pictures need signal; locations are saved offline) ----------
function loadLeaflet(){return new Promise((ok,no)=>{
  if(window.L)return ok();
  const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);
  const sc=document.createElement('script');sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';sc.onload=()=>ok();sc.onerror=no;document.head.appendChild(sc)})}
async function showMap(){
  view='map';const pts=getLog().filter(e=>e.lat!=null);
  show(`<h2>Map of my finds</h2><p class="sub">${pts.length?`${pts.length} find${pts.length>1?'s':''} with a location. Tap a dot for details.`:'No finds with a location yet. New finds save your location automatically.'}</p>
    <div class="card mapbox" id="map"><p class="sub" style="padding:20px">Loading the map…</p></div>
    <div class="dock"><div class="bar"><button class="btn alt" type="button" id="bk">Back to log</button></div></div>`);
  $('#bk').addEventListener('click',showLog);
  try{if(!online())throw 0;await loadLeaflet()}catch(e){$('#map').innerHTML='<p class="sub" style="padding:20px">The map needs signal to load. Your locations are saved and will show here when you\'re back in signal.</p>';return}
  if(view!=='map')return;
  const box=$('#map');box.innerHTML='';
  const map=L.map(box,{zoomControl:true,attributionControl:true}).setView([66.8983,-162.5967],9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  const all=[];
  pts.forEach(e=>{const ll=[e.lat,e.lon];all.push(ll);
    const pop=document.createElement('div');const h=document.createElement('b');h.textContent=e.sp;const d=document.createElement('div');d.textContent=fmt(e.d)+(e.loc?' · '+e.loc:'');
    const bt=document.createElement('button');bt.type='button';bt.className='popb';bt.textContent='Details';bt.addEventListener('click',()=>openEntry(e,showMap));
    pop.append(h,d,bt);
    L.circleMarker(ll,{radius:9,color:'#fff',weight:2,fillColor:e.pending?'#e2561d':'#1d4a3e',fillOpacity:1}).addTo(map).bindPopup(pop)});
  if(all.length>1)map.fitBounds(all,{padding:[30,30],maxZoom:14});else if(all.length)map.setView(all[0],13);
  const me=lastFix;if(me)L.circleMarker([me.lat,me.lon],{radius:6,color:'#2f9e6e',weight:3,fillOpacity:.3}).addTo(map).bindPopup('You were here');
}

const today=()=>new Date().toISOString().slice(0,10);
async function saveFile(name,blob){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return 'saved';
}

      <div class="fact"><span class="ic">${FI.restore}</span><div><b>Restore</b><p>Open a full backup file to bring your log back. Finds you already have are kept.</p>
        <label class="btn alt mini filebtn">Restore from backup<input type="file" id="rf" accept=".json,application/json"></label></div></div>
      <div class="fact"><span class="ic">${FI.local}</span><div><b>Save location with finds</b><p>Uses your phone's GPS to record where each track was. Stays on this phone unless you export it.</p>
        <div class="seg" style="margin:8px 0 0"><button type="button" data-g="1" class="${gpsOn()?'on':''}">On</button><button type="button" data-g="0" class="${gpsOn()?'':'on'}">Off</button></div></div></div>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="dock"><div class="bar"><button class="btn alt" type="button" id="bk">Back to log</button></div></div>`);
  $('#bk').addEventListener('click',showLog);
  app.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{setPref('ktf-gps',b.dataset.g);if(b.dataset.g==='1')getFix();backupScreen()}));
  $('#csv').addEventListener('click',async()=>{
    const rows=[['Date','Time','Animal or bird','Confidence','Place','Latitude','Longitude','GPS accuracy (m)','About']];
    getLog().forEach(e=>{const d=new Date(e.d);rows.push([d.toLocaleDateString(),d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),e.sp,e.c||'',e.loc||'',e.lat??'',e.lon??'',e.acc??'',(e.info&&e.info.about)||ABOUT[e.sp]||''])});
    const r=await saveFile(`track-log-${today()}.csv`,new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv'}));
    $('#msg').textContent=r==='cancel'?'':'Spreadsheet ready.'});
  $('#full').addEventListener('click',async()=>{
    $('#msg').textContent='Preparing your backup…';const log=getLog();const photos={};
    for(const e of log){try{const b=await photoStore('get',e.id);if(b)photos[e.id]=await b2d(b)}catch(x){}}
    const r=await saveFile(`track-finder-backup-${today()}.json`,new Blob([JSON.stringify({app:'kotzebue-track-finder',version:1,saved:new Date().toISOString(),log,photos})],{type:'application/json'}));
    $('#msg').textContent=r==='cancel'?'':`Backup ready: ${log.length} finds, ${Object.keys(photos).length} photos.`});
  $('#rf').addEventListener('change',async ev=>{
    const f=ev.target.files&&ev.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());if(j.app!=='kotzebue-track-finder'||!Array.isArray(j.log))throw 0;
      const l=getLog();const have=new Set(l.map(e=>e.id));let n=0;
      for(const e of j.log){if(!e||!e.id||have.has(e.id))continue;
        const keep={};['id','d','sp','c','loc','thumb','lat','lon','acc','pending','photo','info'].forEach(k=>{if(e[k]!==undefined)keep[k]=e[k]});
        l.push(keep);n++;
        const p=j.photos&&j.photos[e.id];if(typeof p==='string'&&p.startsWith('data:image/')){try{await photoStore('put',e.id,await (await fetch(p)).blob())}catch(x){}}}
      l.sort((x,y)=>String(y.d).localeCompare(String(x.d)));setLog(l.slice(0,500));count();
      $('#msg').textContent=n?`Restored ${n} find${n>1?'s':''}.`:'Nothing new in that backup.';
    }catch(x){$('#msg').textContent='That file isn\'t a Track Finder backup.'}});
}

// ---------- your photos in the field guide ----------
async function gallery(name){
  const box=$('#gal');if(!box)return;
  const mine=getLog().filter(e=>!e.pending&&spMatch(e.sp)&&spMatch(e.sp).n===name);
  if(!mine.length){box.innerHTML=`<p class="section">Your photos</p><p class="sub" style="margin:4px 0 0">When you save a ${esc(name.toLowerCase())} track, your photo will show up here.</p>`;return}
  const pics=[];for(const e of mine.slice(0,12)){let src=e.thumb;try{const b=await photoStore('get',e.id);if(b)src=URL.createObjectURL(b)}catch(x){}if(src)pics.push([e,src])}
  if(view!=='detail')return;
  box.innerHTML=`<p class="section">Your photos (${mine.length})</p><div class="gal">${pics.map(([e,src],i)=>`<button type="button" data-g="${i}"><img src="${esc(src)}" alt=""><span>${esc(fmt(e.d))}</span></button>`).join('')}</div>`;
  box.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{const sp=SP.find(x=>x.n===name);openEntry(pics[+b.dataset.g][0],()=>openSpecies(sp))}));
}
function openSpecies(sp,back){detail(spInfo(sp),{guide:true,top:trackPanel(sp.n)+'<div id="gal"></div>',back:back||(()=>guide()),onExtra:()=>gallery(sp.n)})}

// ---------- track age helper (offline) ----------
const AGEQ=[
 ['look','What do the track edges look like?',[['crisp','Sharp and crisp'],['rounded','A little rounded'],['soft','Soft and blurry'],['filled','Snow inside the print'],['icy','Hard or icy crust']]],
 ['snow','When did it last snow?',[['today','Today'],['yday','Yesterday'],['few','2–3 days ago'],['old','4+ days ago']]],
 ['wind','How windy has it been?',[['calm','Calm'],['breezy','Breezy'],['strong','Strong wind']]],
 ['temp','Temperature lately?',[['cold','Below 0°F'],['cool','0 to 20°F'],['mild','20 to 32°F'],['thaw','Above freezing']]]
];
let ageA={};
function ageEstimate(a){
  if(!a.look)return null;const why=[];let head,fresh=false;
  if(a.look==='crisp'){fresh=true;head=a.wind==='strong'?'Very fresh: probably less than an hour old':'Fresh: probably less than a few hours old';
    why.push('Sharp edges and crisp toe marks haven\'t had time to soften.');if(a.wind==='strong')why.push('Strong wind rounds edges fast, so crisp prints must be very new.');
    if(a.temp==='cold'&&a.wind==='calm')why.push('In calm, very cold weather, prints can stay crisp a bit longer, so allow up to half a day.')}
  if(a.look==='rounded'){head=a.wind==='strong'?'Probably a few hours old':a.temp==='cold'&&a.wind==='calm'?'Probably about a day old':'Probably several hours to a day old';
    why.push('Slightly rounded edges mean wind, sun or settling have started to soften the print.')}
  if(a.look==='soft'){head=a.temp==='thaw'||a.temp==='mild'?'Probably about a day old, maybe less':'Probably 1 to 2 days old';
    why.push('Soft, blurry edges take time to form.');if(a.temp==='thaw'||a.temp==='mild')why.push('Warm weather softens tracks quickly, so it could be younger.')}
  if(a.look==='filled'){head={today:'Made before today\'s snowfall',yday:'Made before yesterday\'s snow: more than a day old',few:'Made before the snow 2–3 days ago: about 3 days old or more',old:'Several days old or more'}[a.snow]||'Made before the last snowfall';
    why.push('New snow sitting inside the print means the track was there when the snow fell.')}
  if(a.look==='icy'){head='Likely 2 or more days old';why.push('A hard crust forms when snow softens and then refreezes, which takes at least a day.')}
  if(a.look!=='filled'&&a.snow==='today')why.push('There\'s no new snow in it, so it was made after today\'s snowfall.');
  if(a.look!=='filled'&&a.snow==='yday')why.push('There\'s no new snow in it, so it was made after yesterday\'s snow.');
  if(a.wind==='strong'&&a.look!=='crisp')why.push('Strong wind can also fill or erase prints, so older tracks may be gone.');
  return {head,why,fresh};
}
function ageTool(){
  view='age';const r=ageEstimate(ageA);
  show(`<h2>How old is the track?</h2><p class="sub">Answer what you can. The estimate updates as you tap.</p>
    ${r?`<div class="card big agecard"><div class="lbl">Estimate</div><h3 style="font-size:30px">${esc(r.head)}</h3>
      <ul>${r.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>${r.fresh?'<div class="warn" style="margin:10px 0 0">'+FI.warn+'<div><b>Fresh tracks</b> mean the animal may be close. Keep your distance from bear, moose and wolf tracks.</div></div>':''}</div>`
      :`<div class="card big agecard"><div class="lbl">Estimate</div><p style="margin:6px 0 0">Start with what the edges of the print look like.</p></div>`}
    ${AGEQ.map(([k,q,opts])=>`<p class="section">${q}</p><div class="chips big">${opts.map(([v,l])=>`<button type="button" data-k="${k}" data-v="${v}" class="${ageA[k]===v?'on':''}">${l}</button>`).join('')}</div>`).join('')}
    <div class="dock"><div class="bar"><button class="btn alt" type="button" id="clr">Clear</button><button class="btn" type="button" id="home">Done</button></div></div>`);
  app.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;ageA[k]=ageA[k]===b.dataset.v?undefined:b.dataset.v;const y=scrollY;ageTool();scrollTo(0,y)}));
  $('#clr').addEventListener('click',()=>{ageA={};ageTool()});$('#home').addEventListener('click',home);
}

// keep the free photo server awake while the app is open, so photo checks are quick
addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')warm()});
setInterval(()=>{if(document.visibilityState==='visible')warm()},10*60e3);
$('#goLog').addEventListener('click',showLog);

count();home();warm();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
}
