<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kotzebue Track Finder</title>
<meta name="theme-color" content="#1f4a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, expert field tool; clear at a glance with cold hands
   IDEA: a camera viewfinder and a naturalist's field card
   PICTURE: the viewfinder on home; the field card with its facts on each answer
   COLOUR and TYPE: snow, deep spruce, blaze orange; Barlow Condensed titles, Inter text
   LAYOUT: one column, sticky brand bar, actions docked at the bottom */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f4,#0d1315);--ink:light-dark(#142024,#e8efed);--soft:light-dark(#5b6a6f,#98aaae);
--card:light-dark(#ffffff,#162124);--line:light-dark(#e1e7e5,#25343a);--chip:light-dark(#edf1f0,#1d2b2f);
--deep:light-dark(#1d4a3e,#86c9b2);--spruce:#1d4a3e;--spruce2:#123129;--blaze:#e2561d;--blaze2:#c94612;--blazeink:light-dark(#b8410f,#ff8a57);
--mark:light-dark(#4b666b,#a9c4c8);--warn:light-dark(#fff3ec,#341f15);--ok:#2f9e6e;
--sh:light-dark(0 1px 2px #10181f0f,0 1px 2px #0006),light-dark(0 6px 20px #10181f0d,0 6px 20px #0004)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;line-height:1.04;margin:0;text-wrap:balance;letter-spacing:.005em}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--spruce),var(--spruce2));color:#f2f5f4;padding:12px max(4vw,14px);padding-top:max(12px,env(safe-area-inset-top))}
.hd{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:#ffffff18;display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px;color:#fff}
.brand{flex:1;line-height:1.15}.brand b{display:block;font:700 23px "Barlow Condensed",sans-serif}.brand span{font-size:12.5px;color:#bcd6cd}
#goLog{position:relative;display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:0;background:#ffffff1c;color:#fff;font:600 15px Inter,sans-serif;cursor:pointer}
#goLog svg{width:20px;height:20px}
#cnt:not(:empty){min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--spruce);font-size:12.5px;font-weight:700;display:grid;place-items:center}
#goLog.dotted #cnt{background:var(--blaze);color:#fff}
main{max-width:600px;margin:0 auto;padding:18px max(4vw,14px) 120px}
.screen h2{font-size:clamp(32px,9vw,40px);margin:4px 0 6px}
.sub{color:var(--soft);margin:0 0 18px}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13.5px;font-weight:600;color:var(--soft);margin:2px 0 14px}
.status i{width:8px;height:8px;border-radius:50%;background:#98a6a9}.status.on i{background:var(--ok);box-shadow:0 0 0 4px #2f9e6e26}
.photo{position:relative;display:block;border-radius:22px;overflow:hidden;aspect-ratio:4/3.2;background:radial-gradient(120% 90% at 50% 20%,#2a5f51,#0f2a23);cursor:pointer;box-shadow:var(--sh)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .vf{position:absolute;inset:18px;pointer-events:none;
 background:linear-gradient(#fff,#fff) 0 0/28px 3px,linear-gradient(#fff,#fff) 0 0/3px 28px,linear-gradient(#fff,#fff) 100% 0/28px 3px,linear-gradient(#fff,#fff) 100% 0/3px 28px,
 linear-gradient(#fff,#fff) 0 100%/28px 3px,linear-gradient(#fff,#fff) 0 100%/3px 28px,linear-gradient(#fff,#fff) 100% 100%/28px 3px,linear-gradient(#fff,#fff) 100% 100%/3px 28px;background-repeat:no-repeat;opacity:.85}
.photo .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#e8f2ee;font-weight:600;text-align:center;padding:0 30px}
.photo .shutter{width:78px;height:78px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px #ffffff33}
.photo .shutter svg{width:34px;height:34px;color:var(--spruce)}
.photo .in small{font-weight:400;color:#b9d3ca;font-size:13.5px}
.photo .retake{position:absolute;right:14px;top:14px;background:#0f2a23cc;color:#fff;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;backdrop-filter:blur(6px)}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo:focus-within{outline:3px solid var(--blaze);outline-offset:3px}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots i{flex:1;height:5px;border-radius:5px;background:var(--line)}.dots i.on{background:var(--blaze)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:148px;padding:16px 10px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 16.5px Inter,sans-serif;text-align:center;cursor:pointer;box-shadow:var(--sh);transition:transform .12s,border-color .12s}
.pick svg{width:68px;height:68px;color:var(--mark)}
.pick:active{transform:scale(.97)}
.pick.sel{border-color:var(--deep);box-shadow:0 0 0 3px light-dark(#1d4a3e22,#86c9b233)}
.pick small{font-weight:400;font-size:13px;color:var(--soft)}
.bar{display:flex;gap:10px;margin-top:16px}
.bar.wrap{flex-wrap:wrap}.bar.wrap .btn{flex:1 1 220px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px max(4vw,14px) max(12px,env(safe-area-inset-bottom));background:light-dark(#f3f5f4e6,#0d1315e6);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.dock .bar{max-width:600px;margin:0 auto}
.btn{flex:1;min-height:54px;padding:12px 18px;border-radius:15px;border:0;background:var(--blaze);color:#fff;font:600 16.5px Inter,sans-serif;cursor:pointer;box-shadow:0 2px 0 var(--blaze2)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.6}
button:focus-visible,input:focus-visible{outline:3px solid var(--blaze);outline-offset:2px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);border:1px solid var(--line)}
.hero{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;margin-bottom:-36px}
.big{padding:20px;position:relative}
.big .lbl{color:var(--soft);font-weight:600;font-size:13px;letter-spacing:.02em}
.big h3{font-size:clamp(38px,11vw,50px);margin:4px 0 2px}
.big em{font-style:italic;color:var(--soft)}
.meter{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-weight:600;font-size:14.5px}
.meter span{display:flex;gap:4px}.meter span i{width:26px;height:8px;border-radius:4px;background:var(--line)}.meter span i.on{background:var(--deep)}
.big p{margin:10px 0 0;color:var(--ink)}
.facts{margin-top:14px;padding:4px 18px}
.fact{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .ic{width:36px;height:36px;border-radius:11px;background:var(--chip);display:grid;place-items:center;color:var(--deep)}
.fact .ic svg{width:20px;height:20px}
.fact b{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:.02em}.fact p{margin:1px 0 0}
.also{display:grid;gap:10px;margin-top:14px}
.small{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font:inherit;cursor:pointer;box-shadow:var(--sh)}
.small div{flex:1}.small h3{font-size:24px}.small p{margin:2px 0 0;font-size:14px;color:var(--soft)}
.small>span{font-size:26px;color:var(--soft)}
.section{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:.02em;margin:22px 0 0}
.warn{display:flex;gap:10px;background:var(--warn);border:1px solid light-dark(#f6c9b3,#5b3322);padding:12px 14px;border-radius:16px;margin:0 0 14px}
.warn b{color:var(--blazeink)}
input[type=text]{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;margin-top:14px}
.msg{min-height:22px;color:var(--deep);font-weight:600;margin-top:10px;font-size:15px}
.wait{text-align:center}.wait .photo{margin-bottom:22px}
.spin{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blaze)}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.log{display:grid;gap:10px;margin-top:6px}
.entry{display:grid;grid-template-columns:60px minmax(0,1fr) 44px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--sh)}
.entry img,.entry .ph{width:60px;height:60px;border-radius:12px;object-fit:cover;background:var(--chip)}
.entry .open{display:block;text-align:left;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.entry h3{font-size:22px}.entry p{margin:2px 0 0;font-size:13.5px;color:var(--soft)}
.entry .del{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--soft);cursor:pointer}
.entry .del svg{width:20px;height:20px}
.entry .idnow{grid-column:2/4;min-height:44px;border:0;border-radius:12px;background:var(--blaze);color:#fff;font:600 15px Inter,sans-serif;cursor:pointer}
.entry .idnow:disabled{background:var(--chip);color:var(--soft)}
.pend{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;background:var(--warn);color:var(--blazeink);font-size:12.5px;font-weight:600}
.empty{text-align:center;padding:40px 10px;color:var(--soft)}.empty svg{width:56px;height:56px;color:var(--mark);margin-bottom:8px}
textarea{width:100%;min-height:140px;font:14px Inter,sans-serif;margin-top:10px;border-radius:14px;padding:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.note{font-size:13.5px;color:var(--soft);margin-top:16px;text-align:center}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.tool{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--sh);min-height:72px}
.tool .ic{width:40px;height:40px;flex:none;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--deep)}.tool .ic svg{width:22px;height:22px}
.tool b{display:block;font-size:15.5px}.tool small{display:block;color:var(--soft);font-size:12.5px;line-height:1.3}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--chip);margin:12px 0 14px}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--soft);font:600 14.5px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.gi{width:46px;height:46px;flex:none;border-radius:13px;background:var(--chip);display:grid;place-items:center}.gi svg{width:30px;height:30px;color:var(--mark)}
.rul{padding:0 0 0 0;overflow:hidden;border-radius:0 16px 16px 0;border-left:0}
.calbox{margin:10px 0 18px;border:3px solid var(--ok);border-radius:12px;background:#2f9e6e1a;display:grid;place-items:center;color:var(--ok);font-weight:700}
input[type=range]{width:100%;height:44px;accent-color:var(--blaze)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .22s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="mark" aria-hidden="true"><svg viewBox="-12 -14 24 26" fill="currentColor"><ellipse cx="0" cy="6" rx="7" ry="6"/><circle cx="-7" cy="-4" r="3"/><circle cx="-2.5" cy="-9" r="3"/><circle cx="2.5" cy="-9" r="3"/><circle cx="7" cy="-4" r="3"/></svg></div>
  <div class="brand"><b>Track Finder</b><span>Kotzebue · Northwest Arctic</span></div>
  <button type="button" id="goLog" aria-label="My log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6M9 11h6"/></svg>Log <span id="cnt"></span></button>
</div></header>
<main id="app"></main>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const Y=[2,2,2,2,2,2,2,2,2,2,2,2],SUM=[0,0,0,0,2,2,2,2,2,1,0,0];

// little pictures (currentColor)
const P=(d,vb='0 0 80 80')=>`<svg viewBox="${vb}" fill="currentColor" aria-hidden="true">${d}</svg>`;
const paw=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="6" rx="7" ry="6"/><circle cx="-7" cy="-4" r="3"/><circle cx="-2.5" cy="-9" r="3"/><circle cx="2.5" cy="-9" r="3"/><circle cx="7" cy="-4" r="3"/></g>`;
const dot=(x,y,r=5)=>`<circle cx="${x}" cy="${y}" r="${r}"/>`;
const IC={
 paw:P(paw(40,42,2.4)),
 hoof:P('<path d="M38 14C26 16 22 34 24 50c1 10 8 16 14 14V14zM42 14c12 2 16 20 14 36-1 10-8 16-14 14V14z"/>'),
 bird:P('<g stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none"><path d="M40 66V40M40 40L20 16M40 40V10M40 40L60 16M40 66v6"/></g>'),
 t4:P(paw(40,42,2.4)),
 t5:P('<g transform="translate(40 44) scale(2.3)"><ellipse cx="0" cy="6" rx="7.5" ry="6"/><circle cx="-9" cy="-1" r="2.6"/><circle cx="-5" cy="-7" r="2.6"/><circle cx="0" cy="-9" r="2.6"/><circle cx="5" cy="-7" r="2.6"/><circle cx="9" cy="-1" r="2.6"/></g>'),
 thin:P('<g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"><path d="M40 50L18 18M40 50V10M40 50L62 18M40 50V72"/></g>'),
 feather:P('<g stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none" opacity=".85"><path d="M40 52L22 22M40 52V16M40 52L58 22"/></g>'),
 web:P('<path d="M40 64L14 22Q27 30 40 14Q53 30 66 22Z"/><path d="M40 64v10" stroke="currentColor" stroke-width="5"/>'),
 zygo:P('<g stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none"><path d="M40 40L24 12M40 40L56 12M40 40L22 68M40 40L58 68"/></g>'),
 line:P([10,24,38,52,66].map((y,i)=>dot(i%2?46:34,y+2)).join('')),
 wander:P([[16,14],[34,22],[24,38],[48,40],[38,58],[62,62]].map(([x,y])=>dot(x,y)).join('')),
 pairs:P([14,40,66].map(y=>dot(32,y)+dot(48,y)).join('')),
 four:P([12,48].map(y=>dot(30,y+16,4)+dot(50,y+16,4)+dot(36,y+4,6)+dot(46,y+4,6)).join('')),
 waddle:P([14,40,66].map((y,i)=>`<ellipse cx="${i%2?52:28}" cy="${y}" rx="9" ry="7"/>`).join('')+'<path d="M18 4v74M62 4v74" stroke="currentColor" stroke-width="2" opacity=".4"/>'),
 slide:P('<rect x="30" y="8" width="20" height="50" rx="10" opacity=".55"/>'+dot(32,68,4)+dot(48,68,4)),
 herd:P([[20,14],[40,22],[60,12],[28,40],[52,44],[18,64],[44,66],[64,60]].map(([x,y])=>`<path d="M${x-1} ${y-7}c-5 1-6 8-5 13 1 3 3 4 5 3zM${x+1} ${y-7}c5 1 6 8 5 13-1 3-3 4-5 3z"/>`).join('')),
 walk:P([12,32,52].map((y,i)=>`<g transform="translate(${i%2?48:32} ${y+10})" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M0 6L-7-6M0 6V-8M0 6L7-6"/></g>`).join('')),
 hop:P([18,50].map(y=>[30,50].map(x=>`<g transform="translate(${x} ${y+8})" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M0 6L-7-6M0 6V-8M0 6L7-6"/></g>`).join('')).join('')),
 wings:P('<path d="M40 40C26 30 12 30 4 36c10 2 20 6 30 10zM40 40c14-10 28-10 36-4-10 2-20 6-30 10z" opacity=".7"/>'+dot(40,46,7)),
 town:P('<path d="M8 70V40l16-14 16 14v30zM44 70V30l14-12 14 12v40z"/>'),
 coast:P('<path d="M0 50c12-8 24 8 40 0s28 8 40 0v30H0z" opacity=".55"/><path d="M0 62c12-8 24 8 40 0s28 8 40 0v18H0z"/>'),
 tundra:P('<path d="M0 60h80v20H0z"/><path d="M0 60c20-8 50-8 80 0" opacity=".4"/>'),
 willow:P('<g stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"><path d="M24 74V30M24 46l-12-14M24 40l12-16M56 74V24M56 40l-14-14M56 50l12-14"/></g>'),
 water:P('<ellipse cx="40" cy="52" rx="34" ry="16" opacity=".55"/><path d="M18 52h12M40 58h16" stroke="currentColor" stroke-width="3"/>'),
 hills:P('<path d="M0 72L26 26l18 26 12-16 24 36z"/>'),
 cam:P('<path d="M10 26h14l6-8h20l6 8h14v40H10z"/><circle cx="40" cy="45" r="12" fill="var(--chip)"/>'),
 unsure:P('<text x="40" y="58" font-size="52" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="700">?</text>')
};

// size choices in inches [lo,hi]
const SIZES=[['xs',[0,1],'Smaller than a quarter'],['s',[1,2.5],'Quarter to two fingers wide'],['m',[2.5,4.5],'About my palm'],['l',[4.5,7],'About my whole hand'],['xl',[7,14],'Bigger than my hand']];
const sizeIcon=r=>P(`<rect x="${40-r}" y="${40-r}" width="${2*r}" height="${2*r}" rx="${r*.45}" opacity=".85"/>`);

const STEPS={
 kind:{q:'What do the marks look like?',opts:[['paw','Paws with toes',IC.paw],['hoof','Hooves, 2 halves',IC.hoof],['bird','Bird feet',IC.bird]]},
 toes:{q:'How many toes?',sub:'Count on the clearest print.',opts:[['4','4 toes',IC.t4],['5','5 toes',IC.t5]]},
 foot:{q:'What shape are the toes?',opts:[['thin','Thin toes',IC.thin],['feather','Thick, fuzzy toes',IC.feather],['web','Webbed',IC.web],['zygo','2 forward, 2 back',IC.zygo]]},
 size:{q:'How big is one print?',sub:'Hold your hand next to it.',opts:SIZES.map(([v,,l],i)=>[v,l,sizeIcon(8+i*6)])},
 pat:{q:'How are the prints laid out?',sub:'Step back and look at the trail.',byKind:{
   paw:[['line','In a straight line',IC.line],['wander','Wandering all over',IC.wander],['pairs','In pairs',IC.pairs],['four','Groups of 4',IC.four],['waddle','Wide, waddling',IC.waddle],['slide','Slides or tunnels',IC.slide]],
   hoof:[['line','One line',IC.line],['herd','Many animals',IC.herd]],
   bird:[['walk','Walking',IC.walk],['hop','Hopping',IC.hop],['wings','Wing marks',IC.wings]]}},
 hab:{q:'Where are you?',opts:[['town','Town',IC.town],['coast','Beach or ice',IC.coast],['tundra','Open tundra',IC.tundra],['willow','Willows or river',IC.willow],['water','Pond or creek',IC.water],['hills','Hills',IC.hills]]}
};
const PATMAP={line:['line','lope'],wander:['wander'],pairs:['pairs'],four:['four'],waddle:['waddle','drag'],slide:['slide','tunnel'],herd:['herd'],walk:['walk'],hop:['hop'],wings:['wings']};
const HABMAP={town:['town'],coast:['coast','ice'],tundra:['tundra'],willow:['willow'],water:['water'],hills:['hills']};

// ---------- photo ----------
function shrink(img,max){const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
function onPhoto(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  clearPhoto();photoURL=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{try{shrink(img,1024).toBlob(b=>{photoBlob=b||f;home()},'image/jpeg',.82);thumb=shrink(img,160).toDataURL('image/jpeg',.6)}catch(err){photoBlob=f;home()}};
  img.onerror=()=>{photoBlob=f;home()};
  img.src=photoURL;warm();
}
const toB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(b)});

// photos saved for later live in IndexedDB on the phone
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('ktf',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function photoStore(mode,id,blob){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction('photos',mode==='get'?'readonly':'readwrite');const s=t.objectStore('photos');
  const q=mode==='get'?s.get(id):mode==='put'?s.put(blob,id):s.delete(id);t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})}
async function saveForLater(){
  if(!photoBlob)return;const id='p'+Date.now();
  try{await photoStore('put',id,photoBlob)}catch(e){$('#msg').textContent='Couldn\'t save the photo on this phone.';return}
  addEntry({id,sp:'Not identified yet',c:'',pending:1});
  $('#msg').textContent='Saved. Open My log when you have signal and tap Identify now.';
}

// ---------- access code ----------
function askCode(then,wrong){
  view='code';
  show(`<h2>Enter your access code</h2><p class="sub">${wrong?'That code didn\'t work. Check it and try again.':'You only need to do this once on this phone.'}</p>
    <input type="text" id="code" autocomplete="off" autocapitalize="off" placeholder="Access code" aria-label="Access code">
    <div class="bar"><button class="btn" type="button" id="ok">Continue</button><button class="btn alt" type="button" id="cancel">Cancel</button></div>`);
  const go=()=>{const v=$('#code').value.trim();if(v){setCode(v);then()}};
  $('#ok').addEventListener('click',go);$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  $('#cancel').addEventListener('click',home);$('#code').focus();
}

// ---------- photo identification ----------
async function photoId(blob,answers,fromLog){
  if(!blob)return home();
  if(!online())return failed('You have no signal right now.',blob,fromLog);
  if(!getCode())return askCode(()=>photoId(blob,answers,fromLog));
  view='wait';const url=URL.createObjectURL(blob);
  show(`<div class="wait"><div class="photo" style="cursor:default"><img src="${url}" alt=""></div>
    <div class="spin"></div><h2>Studying your track…</h2><p class="sub" id="slow">This usually takes a few seconds.</p></div>`);
  const slow=setTimeout(()=>{const s=$('#slow');if(s)s.textContent='Waking up the server. The first check of the day can take up to a minute.'},8000);
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),90000);
  try{
    const r=await fetch(API+'/api/identify',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
      body:JSON.stringify({code:getCode(),image:await toB64(blob),answers,month:new Date().getMonth()})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){setCode('');return askCode(()=>photoId(blob,answers,fromLog),true)}
    if(r.status===503)return failed('Photo checking isn\'t switched on yet.',blob,fromLog);
    if(r.status===429)return failed('Too many photos this hour. Try again later.',blob,fromLog);
    if(!r.ok||!j.name)return failed('Something went wrong checking the photo.',blob,fromLog);
    detail(j,{photo:true,fromLog});
  }catch(e){failed(e.name==='AbortError'?'It took too long. The signal may be weak.':'Couldn\'t connect. The signal may be weak.',blob,fromLog)}
  finally{clearTimeout(slow);clearTimeout(to)}
}
function failed(msg,blob,fromLog){
  view='failed';
  show(`<div class="empty" style="padding:24px 10px 6px">${FI.warn}</div><h2>Couldn't check the photo</h2><p class="sub">${esc(msg)}</p>
    <div class="bar wrap"><button class="btn" type="button" id="retry">Try again</button>
    ${fromLog?'':'<button class="btn alt" type="button" id="later">Save photo, check later</button>'}
    <button class="btn alt" type="button" id="taps">Answer a few taps</button></div><div class="msg" id="msg" role="status"></div>`);
  $('#retry').addEventListener('click',()=>photoId(blob,'',fromLog));
  $('#taps').addEventListener('click',()=>{a={};step=0;ask()});
  const lt=$('#later');if(lt)lt.addEventListener('click',saveForLater);
}

  if(o.fromLog){finishPending(o.fromLog,d);const sv0=$('#save');if(sv0)sv0.remove();$('#msg').textContent='Updated in your log.'}
  const sv=$('#save');if(sv)sv.addEventListener('click',()=>{
    if(o.fromLog)finishPending(o.fromLog,d);else addEntry({sp:d.name,c:d.sure||'',info:d});

  $('#next').addEventListener('click',()=>{if(o.guide)return guide();if(o.saved)return showLog();clearPhoto();home()});

// ---------- tap questions (work offline) ----------
function ask(){
  view='ask';flow=pathFor();const key=flow[step];const S=STEPS[key];
  const opts=S.byKind?S.byKind[a.kind]:S.opts;
  show(`<div class="dots">${flow.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
    <h2>${S.q}</h2><p class="sub">${S.sub||'&nbsp;'}</p>
    <div class="grid">${opts.map(([v,l,ic])=>`<button type="button" class="pick ${a[key]===v?'sel':''}" data-v="${v}">${ic}<span>${l}</span></button>`).join('')}
      ${key!=='kind'?`<button type="button" class="pick" data-v="">${IC.unsure}<span>Not sure</span><small>Skip</small></button>`:''}</div>
    <div class="bar"><button class="btn alt" type="button" id="back">Back</button></div>`);
  app.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>{
    a[key]=b.dataset.v||null;
    if(key==='kind'){delete a.toes;delete a.foot;delete a.pat}
    flow=pathFor();step++;step<flow.length?ask():results();
  }));
  $('#back').addEventListener('click',()=>{step?(step--,ask()):home()});
}
function score(sp,m){
  if(a.kind&&sp.k!==a.kind)return null;
  let s=0;
  if(a.toes){s+=sp.toes.includes(+a.toes)?3:-4}
  if(a.foot){s+=sp.foot===a.foot?4:-5}
  if(a.size){const [lo,hi]=SIZES.find(x=>x[0]===a.size)[1];
    if(sp.sz[0]<=hi&&sp.sz[1]>=lo)s+=4;else{const d=sp.sz[1]<lo?(lo-sp.sz[1])/lo:(sp.sz[0]-hi)/hi;s+=d<0.3?0:-5}}
  if(a.pat){s+=PATMAP[a.pat].some(p=>sp.pat.includes(p))?3:-2}
  if(a.hab){s+=HABMAP[a.hab].some(h=>sp.hab.includes(h))?1.5:-0.5}
  const v=sp.mo[m];s+=v===2?1:v===0?-4:0;
  return {sp,s};
}
const answerText=()=>Object.entries(a).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join(', ');
function infoFor(r,c,others){
  return {name:r.sp.n,inupiaq:r.sp.inu,sure:c,about:ABOUT[r.sp.n]||'',why:r.sp.tip,
    safety:r.sp.safe?'If the tracks look fresh, don\'t follow them. Go back the way you came and keep kids and dogs close.':'',
    also:others};
}
function results(){
  const m=new Date().getMonth();
  const all=SP.map(sp=>score(sp,m)).filter(Boolean).sort((x,y)=>y.s-x.s);
  res=all.slice(0,3);const t=res[0].s,t2=res[1]?res[1].s:-9;
  const c=t>=9&&t-t2>=3?'Pretty sure':t>=5?'Good guess':'Rough guess';
  const others=res.slice(1).map(r=>r.sp.n).join(' or ');
  const canPhoto=photoBlob&&online();
  const extra=(canPhoto?'<button class="btn alt" type="button" id="chk">Check my photo too</button>':'')+'<button class="btn alt" type="button" id="chg">Change my answers</button>';
  detail(infoFor(res[0],c,''),{extra,onExtra:()=>{
    const ck=$('#chk');if(ck)ck.addEventListener('click',()=>photoId(photoBlob,answerText()));
    $('#chg').addEventListener('click',()=>{step=flow.length-1;ask()});
    if(res.length>1){const box=$('#more');box.className='also';
      box.innerHTML='<p class="section">Other possibilities</p>'+res.slice(1).map((r,i)=>`<button type="button" class="small" data-o="${i+1}"><div><h3>${esc(r.sp.n)}</h3><p>${esc(r.sp.tip)}</p></div><span aria-hidden="true">›</span></button>`).join('');
      box.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>{const r=res[+b.dataset.o];detail(infoFor(r,'Possible',res[0].sp.n),{extra:'<button class="btn alt" type="button" id="bk">Back to best match</button>',onExtra:()=>$('#bk').addEventListener('click',results)})}));
    }
  }});
}

// ---------- field guide (offline) ----------
const HABN={town:'town',coast:'beaches',ice:'sea ice',tundra:'open tundra',willow:'willows and rivers',hills:'hills',water:'ponds and creeks'};
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function season(mo){
  if(mo.every(v=>v===2))return 'All year';
  const on=mo.map(v=>v===2);let st=on.findIndex((v,i)=>v&&!on[(i+11)%12]);if(st<0)st=0;
  let en=st;while(on[(en+1)%12]&&(en+1)%12!==st)en=(en+1)%12;
  return `Most often ${MS[st]}–${MS[en]}`+(mo.some(v=>v===0)?', rarely seen other months':'');
}
const inch=x=>x<1?`${x}`:`${x}`;
function spInfo(sp){
  const now=sp.mo[new Date().getMonth()];
  return {name:sp.n,inupiaq:sp.inu,about:ABOUT[sp.n]||'',why:sp.tip,
    size:`${sp.sz[0]}–${sp.sz[1]} in (${Math.round(sp.sz[0]*2.54)}–${Math.round(sp.sz[1]*2.54)} cm)`,
    local:`Look in ${sp.hab.map(h=>HABN[h]).join(', ')}. ${season(sp.mo)}.`+(now===0?' Not likely right now.':now===2?' Likely right now.':''),
    safety:sp.safe?'Give this animal plenty of room. Don\'t follow fresh tracks.':''};
}
let gFilter='all',gQuery='';
function guide(){
  view='guide';
  const F=[['all','All'],['paw','Paws'],['hoof','Hooves'],['bird','Birds']];
  const list=SP.filter(sp=>(gFilter==='all'||sp.k===gFilter)&&(!gQuery||(sp.n+' '+sp.inu).toLowerCase().includes(gQuery.toLowerCase())));
  show(`<h2>Field guide</h2><p class="sub">Works offline. Tap an animal for details.</p>
    <input type="text" id="q" placeholder="Search by name" value="${esc(gQuery)}" aria-label="Search" style="margin-top:0">
    <div class="seg">${F.map(([v,l])=>`<button type="button" data-f="${v}" class="${gFilter===v?'on':''}">${l}</button>`).join('')}</div>
    <div class="log">${list.map(sp=>`<button type="button" class="small" data-sp="${esc(sp.n)}"><span class="gi">${sp.k==='bird'?IC.bird:sp.k==='hoof'?IC.hoof:IC.paw}</span>
      <div><h3>${esc(sp.n)}</h3><p>${sp.inu?esc(sp.inu)+' · ':''}${sp.sz[0]}–${sp.sz[1]} in</p></div><span aria-hidden="true">›</span></button>`).join('')||'<p class="empty">No match.</p>'}</div>
    <div class="dock"><div class="bar"><button class="btn alt" type="button" id="home">Back</button></div></div>`);
  const q=$('#q');q.addEventListener('input',()=>{gQuery=q.value;const pos=q.selectionStart;guide();const q2=$('#q');q2.focus();q2.setSelectionRange(pos,pos)});
  app.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{gFilter=b.dataset.f;guide()}));
  app.querySelectorAll('[data-sp]').forEach(b=>b.addEventListener('click',()=>{const sp=SP.find(x=>x.n===b.dataset.sp);
    detail(spInfo(sp),{guide:true})}));
  $('#home').addEventListener('click',home);
}

// ---------- on-screen ruler, calibrated once with a bank card (3.37 in wide) ----------
function ruler(){
  view='ruler';let ppi=0;try{ppi=+localStorage.getItem('ktf-ppi')||0}catch(e){}
  if(!ppi)return calibrate();
  let unit='in';try{unit=localStorage.getItem('ktf-unit')||'in'}catch(e){}
  show(`<h2>Ruler</h2><p class="sub">Lay your phone next to the print, or hold it just above.</p>
    <div class="seg">${['in','cm'].map(u=>`<button type="button" data-u="${u}" class="${u===unit?'on':''}">${u==='in'?'Inches':'Centimeters'}</button>`).join('')}</div>
    <div class="rul card" id="rul"></div>
    <div class="dock"><div class="bar"><button class="btn alt" type="button" id="recal">Set up again</button><button class="btn" type="button" id="home">Done</button></div></div>`);
  const box=$('#rul');const H=Math.min(innerHeight-330,ppi*7);box.style.height=H+'px';
  const per=unit==='in'?ppi:ppi/2.54,sub=unit==='in'?8:10,n=Math.floor(H/per*sub);
  let t='';for(let i=0;i<=n;i++){const y=i*per/sub,maj=i%sub===0,mid=unit==='in'?i%4===0:i%5===0;
    t+=`<line x1="0" x2="${maj?56:mid?38:22}" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="${maj?2:1}"/>`+(maj&&i?`<text x="64" y="${y+6}" font-size="18" font-weight="700" fill="currentColor">${i/sub}</text>`:'');}
  box.innerHTML=`<svg width="100%" height="${H}" style="display:block;color:var(--ink)">${t}</svg>`;
  app.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click',()=>{try{localStorage.setItem('ktf-unit',b.dataset.u)}catch(e){}ruler()}));
  $('#recal').addEventListener('click',calibrate);$('#home').addEventListener('click',home);
}
function calibrate(){
  view='cal';let w=Math.min(innerWidth-40,260);
  show(`<h2>Set up the ruler</h2><p class="sub">Every phone screen is a different size. Hold any bank or ID card flat on the screen, then drag the slider until the green box is exactly as wide as the card.</p>
    <input type="range" id="sl" min="150" max="${innerWidth-20}" value="${w}" aria-label="Card width">
    <div class="calbox" id="cb"><span>Card width</span></div>
    <div class="dock"><div class="bar"><button class="btn alt" type="button" id="cancel">Cancel</button><button class="btn" type="button" id="ok">It matches</button></div></div>`);
  const cb=$('#cb'),sl=$('#sl');const set=()=>{cb.style.width=sl.value+'px';cb.style.height=(sl.value*2.125/3.37)+'px'};set();
  sl.addEventListener('input',set);
  $('#ok').addEventListener('click',()=>{try{localStorage.setItem('ktf-ppi',String(sl.value/3.37))}catch(e){}ruler()});
  $('#cancel').addEventListener('click',home);
}

// ---------- log ----------
const KEY='ktf-log';
const getLog=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}};
const setLog=l=>{try{localStorage.setItem(KEY,JSON.stringify(l));return true}catch(e){return false}};
const fmt=d=>{const x=new Date(d);return x.toLocaleDateString(undefined,{month:'short',day:'numeric'})+', '+x.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};
function count(){const l=getLog(),p=l.filter(e=>e.pending).length;$('#cnt').textContent=l.length?String(l.length):'';$('#goLog').classList.toggle('dotted',p>0)}
function addEntry(e){
  const l=getLog();const loc=(($('#loc')||{}).value||'').trim();
  l.unshift({id:e.id||'e'+Date.now(),d:new Date().toISOString(),loc,thumb:thumb&&thumb!=='x'?thumb:'',...e});
  if(!setLog(l.slice(0,300))){l[0].thumb='';setLog(l.slice(0,300))}
  count();
}
function finishPending(id,info){
  const l=getLog();const e=l.find(x=>x.id===id);if(!e)return;
  Object.assign(e,{sp:info.name,c:info.sure||'',info,pending:0});setLog(l);count();photoStore('del',id).catch(()=>{});
}
function showLog(){
  view='log';const l=getLog();const on=online();
  show(`<h2>My log</h2><p class="sub">${l.length?`${l.length} track${l.length>1?'s':''} saved on this phone. Tap one for details.`:'Tracks you save show up here.'}</p>
    <div class="log">${l.length?l.map((e,i)=>`<div class="entry">${e.thumb?`<img src="${esc(e.thumb)}" alt="">`:'<div class="ph"></div>'}
      <button type="button" class="open" data-open="${i}"><h3>${esc(e.sp)}</h3><p>${esc(fmt(e.d))}${e.loc?' · '+esc(e.loc):''}</p>
        ${e.pending?'<span class="pend">Waiting to identify</span>':e.c?`<p>${esc(e.c)}</p>`:''}</button>
      <button type="button" class="del" data-del="${i}" aria-label="Delete">${FI.trash}</button>
      ${e.pending?`<button type="button" class="idnow" data-id="${esc(e.id)}" ${on?'':'disabled'}>${on?'Identify now':'Needs signal to identify'}</button>`:''}</div>`).join('')
      :`<div class="empty">${IC.paw}<p>No tracks yet. Find one and tap Save.</p></div>`}</div>
    ${l.length?'<div class="bar"><button class="btn alt" type="button" id="copy">Copy my log as text</button></div>':''}
    <textarea id="ta" hidden aria-label="Log text"></textarea>
    <div class="dock"><div class="bar"><button class="btn" type="button" id="home">Find a track</button></div></div>`);
  app.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{const x=getLog();const [gone]=x.splice(+b.dataset.del,1);if(gone&&gone.pending)photoStore('del',gone.id).catch(()=>{});setLog(x);count();showLog()}));
  app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const e=l[+b.dataset.open];
    if(e.info)detail(e.info,{saved:e.d,img:e.thumb});else if(!e.pending)detail({name:e.sp,sure:e.c,about:ABOUT[e.sp]||''},{saved:e.d,img:e.thumb})}));
  app.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',async()=>{
    let blob;try{blob=await photoStore('get',b.dataset.id)}catch(e){}
    if(!blob){b.textContent='Photo missing';return}
    const e=getLog().find(x=>x.id===b.dataset.id);thumb=e&&e.thumb||'';photoId(blob,'',b.dataset.id)}));
  $('#home').addEventListener('click',()=>{clearPhoto();home()});
  const cp=$('#copy');if(cp)cp.addEventListener('click',async()=>{
    const txt=l.map(e=>`${fmt(e.d)} | ${e.loc||'-'} | ${e.sp} | ${e.c||'-'}`).join('\n');
    try{await navigator.clipboard.writeText(txt);cp.textContent='Copied ✓'}catch(err){const ta=$('#ta');ta.hidden=false;ta.value=txt;ta.select();cp.textContent='Copy the text below'}
  });
}
$('#goLog').addEventListener('click',showLog);

count();home();warm();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
}
</script>
